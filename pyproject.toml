[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiking-router"
version = "0.1.0"
description = "Terrain-aware hiking route generator"
requires-python = ">=3.13"
dependencies = [
  "typer>=0.24.1",
  "pydantic>=2.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2",
]

[project.scripts]
hiking-router = "hiking_router.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
